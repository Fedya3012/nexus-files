[package]
name = "nexus-core"
description = "Shared Rust core of Nexus Files: listing, search, file operations with undo, session."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "nexus_core"
crate-type = ["lib", "cdylib"]

[dependencies]
uniffi = { workspace = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3"
unicode-normalization = "0.1"
ignore = "0.4"
trash = "5"
dirs = "6"
filetime = "0.2"
fs4 = "0.13"
imagesize = "0.13"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"
